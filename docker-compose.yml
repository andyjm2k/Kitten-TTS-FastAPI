version: '3.8'

services:
  kitten-tts:
    build: .
    container_name: kitten-tts
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - MODEL_NAME=KittenML/kitten-tts-mini-0.8
      # Uncomment and set API key to enable authentication
      # - API_KEY=your-secret-api-key-here
    volumes:
      # Persist Hugging Face cache to avoid re-downloading model
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  hf-cache:
    name: kitten-tts-hf-cache
